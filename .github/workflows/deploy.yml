name: Build and deploy website

# Push to main, or "Run workflow" on main in the Actions tab: build and deploy to the new server.
# Pull requests are checked by checks.yml.
#
# The job runs in the "production" environment, which only accepts the main branch,
# so a deploy can't be started from any other branch.
#
# new.indilib.org and indilib.org are both served from the new server. Until launch the site is
# built for new.indilib.org and hidden from search engines. At launch, after the indilib.org DNS
# points to the new server, set the repository variable SITE_URL to https://indilib.org and run
# this workflow again.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://new.indilib.org' }}
  # Search engines are kept out until the site is built for indilib.org
  STAGING: ${{ vars.SITE_URL != 'https://indilib.org' }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site for ${{ env.SITE_URL }}
        run: npm run build

      # The API reference at /api/ is generated from the current INDI source with its Doxyfile,
      # at the same URLs as on the old site (for example /api/classINDI_1_1BaseClient.html).
      - name: Build API reference from INDI source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq doxygen > /dev/null
          git clone --depth 1 https://github.com/indilib/indi.git "$RUNNER_TEMP/indi"
          cd "$RUNNER_TEMP/indi"
          (cat Doxyfile
           echo "OUTPUT_DIRECTORY=$GITHUB_WORKSPACE/dist"
           echo "HTML_OUTPUT=api"
           echo "QUIET=YES"
           echo "WARNINGS=NO"
           echo "WARN_LOGFILE=/dev/null") | doxygen -
          test -f "$GITHUB_WORKSPACE/dist/api/index.html"
          echo "API reference: $(find "$GITHUB_WORKSPACE/dist/api" -type f | wc -l) files"

      # rsync --delete removes everything in the target that is not part of the site,
      # so refuse anything that looks like a top-level or home folder.
      # Exception: when the server locks the deploy key to one folder with rrsync, paths are
      # inside that folder ("/" is the folder itself). DEPLOY_RRSYNC_ROOT records that folder.
      - name: Check deploy folder
        env:
          TARGET: ${{ secrets.DEPLOY_PATH }}
          RRSYNC_ROOT: ${{ vars.DEPLOY_RRSYNC_ROOT }}
        run: |
          if [ -n "$RRSYNC_ROOT" ]; then
            echo "Server limits this key to $RRSYNC_ROOT with rrsync; deploying inside it."
            exit 0
          fi
          # Strip spaces and trailing slashes, then count the folder levels
          t="$(printf '%s' "$TARGET" | tr -d '[:space:]' | sed -E 's#/+$##')"
          rel="${t#\~/}"; rel="${rel#\~}"; rel="${rel#/}"
          levels=$(printf '%s' "$rel" | tr '/' '\n' | grep -c .)
          min=1
          case "$t" in /*) min=3 ;; esac
          if [ "$levels" -lt "$min" ] || printf '%s' "/$rel/" | grep -qE '/\.{1,2}/'; then
            echo "::error::DEPLOY_PATH must be the site's own folder, for example public_html or /var/www/new.indilib.org/html. Absolute paths need at least 3 levels."
            exit 1
          fi
          echo "Deploy folder accepted ($levels levels)."

      - name: rsync to the server
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches: -azv --delete
          path: dist/
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.REMOTE_HOST }}
          remote_port: ${{ secrets.REMOTE_PORT || '22' }}
          remote_user: ${{ secrets.REMOTE_USER }}
          remote_key: ${{ secrets.REMOTE_PRIVATE_KEY }}
