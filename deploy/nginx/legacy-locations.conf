# Old indilib.org (Joomla) URLs, part 2 of 2. Include inside the server { } block of
# indilib.org, after root is set:
#   include /etc/nginx/indilib/legacy-locations.conf;
#
# Pages that moved have their own redirect file in the site, so most old URLs are
# handled without these rules. These cover patterns that cannot be static files.

error_page 404 /404.html;

# Joomla entry point: articles by number, the old forum, everything else to the home page
location = /index.php {
    if ($indi_article_target) { return 301 $indi_article_target; }
    if ($arg_option = com_kunena) { return 301 https://forum.indilib.org/; }
    if ($arg_option = com_users) { return 301 https://forum.indilib.org/login; }
    if ($arg_format = feed) { return 301 /about/news.html; }
    return 301 /;
}

# The forum moved to Discourse. Topic numbers are kept; Discourse maps the old paths.
location = /forum { return 301 https://forum.indilib.org/; }
location ^~ /forum/ { return 301 https://forum.indilib.org$request_uri; }
location ^~ /kunena { return 301 https://forum.indilib.org/; }

# Accounts now live on the forum
location ~ ^/(signin|login|register|registration|password-reset|username-reminder|profile|logout)(\.html)?$ {
    return 301 https://forum.indilib.org/login;
}

# RSS feeds
location ~ \.feed$ { return 301 /about/news.html; }

# Joomla components and jDownloads search pages
location ^~ /component/tags/ { return 301 /tutorials.html; }
location ^~ /component/ {
    if ($indi_article_target) { return 301 $indi_article_target; }
    return 301 /;
}
location ~ ^/download/(.+/)?search\.html$ { return 301 /download.html; }
location ^~ /administrator { return 410; }

# Old images and files. Copy the old site's images/ folder to /home/indi/www/legacy/images
# once; it stays outside the deploy folder so deploys never delete it.
location ^~ /images/ { try_files $uri @indi_legacy_files; }
location ^~ /media/ { try_files $uri @indi_legacy_files; }
location @indi_legacy_files { root /home/indi/www/legacy; try_files $uri =404; }

# Folders with a trailing slash: /about/ -> /about
location ~ ^(/.+)/$ {
    if (-f $request_filename/index.html) { break; }
    return 301 $1;
}

# Pages: /about/features.html, also without .html. Unknown old URLs that carry an
# article number go to that article's new page; everything else gets the 404 page.
location / {
    if ($arg_format = feed) { return 301 /about/news.html; }
    try_files $uri $uri.html $uri/ @indi_legacy;
}
location @indi_legacy {
    if ($indi_article_target) { return 301 $indi_article_target; }
    return 404;
}
