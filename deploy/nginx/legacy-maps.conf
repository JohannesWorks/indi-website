# Old indilib.org (Joomla) URLs, part 1 of 2. Include inside the http { } block:
#   include /etc/nginx/indilib/legacy-maps.conf;

# Joomla article number from the path: /any/category/237-old-title.html
map $uri $indi_id_path {
    "~/(?<n>\d+)-[^/]*\.html$"  $n;
    default                     "";
}

# Joomla article number from the query: index.php?option=com_content&view=article&id=237:title
map "$arg_option|$arg_view|$arg_id" $indi_id_query {
    "~^com_content\|article\|(?<n>\d+)"  $n;
    default                              "";
}

map "$indi_id_path|$indi_id_query" $indi_article {
    "~^(?<n>\d+)\|"   $n;
    "~\|(?<n>\d+)$"   $n;
    default           "";
}

# Article number -> new URL
map $indi_article $indi_article_target {
    default "";
    include /etc/nginx/indilib/legacy-ids.map;
}
